<header id="home" class="w-full h-full min-w-0">
  <div class="w-full h-full min-w-0">

    <div
      class="header-banner
             relative
             flex
             min-h-[190px]
             w-full
             min-w-0
             h-full
             items-center
             justify-center
             overflow-hidden
             px-2
             py-8
             text-center
             sm:min-h-[210px]
             sm:px-4
             sm:py-9
             md:min-h-[220px]
             md:px-5
             md:py-10"
    >

      <!-- PRAWY GÓRNY ORNAMENT -->

      <div
        class="pointer-events-none absolute -right-24 -top-24
               h-[320px] w-[320px] rounded-full
               border border-[var(--brand-burgundy)]/[0.10]"
        aria-hidden="true"
      ></div>

      <div
        class="pointer-events-none absolute -right-10 -top-10
               h-[250px] w-[250px] rounded-full
               border border-[var(--brand-gold)]/[0.18]"
        aria-hidden="true"
      ></div>

      <div
        class="pointer-events-none absolute -right-1 top-1
               h-[190px] w-[190px] rounded-full
               border border-[var(--brand-gold)]/[0.12]"
        aria-hidden="true"
      ></div>


      <!-- LEWY DOLNY ORNAMENT -->

      <div
        class="pointer-events-none absolute -bottom-28 -left-28
               h-[300px] w-[300px] rounded-full
               border border-[var(--brand-gold)]/[0.12]"
        aria-hidden="true"
      ></div>

      <div
        class="pointer-events-none absolute -bottom-16 -left-16
               h-[220px] w-[220px] rounded-full
               border border-[var(--brand-burgundy)]/[0.07]"
        aria-hidden="true"
      ></div>


      <!-- DELIKATNA SIATKA -->

      <div
        class="pointer-events-none absolute inset-0 opacity-30"
        aria-hidden="true"
      >
        <div
          class="absolute inset-0
                 bg-[linear-gradient(135deg,transparent_0%,transparent_48%,rgba(var(--brand-gold-rgb),0.10)_49%,transparent_50%,transparent_100%)]"
        ></div>

        <div
          class="absolute inset-0
                 bg-[linear-gradient(45deg,transparent_0%,transparent_48%,rgba(var(--brand-gold-rgb),0.07)_49%,transparent_50%,transparent_100%)]"
        ></div>
      </div>


      <!-- TREŚĆ -->

      <div
        class="relative z-10
               flex
               w-full
               min-w-0
               max-w-full
               flex-col
               items-center
               font-['Libre_Baskerville']"
      >

        <!-- KANCELARIA NOTARIALNA -->

      <p
        class="header-subtitle
              m-0
              block
              w-full
              max-w-full
              whitespace-nowrap
              text-center
              font-normal
              uppercase
              tracking-[0.06em]
              text-stone-500"
      >
        {{ bannerParts[0] }}
      </p>


        <!-- IMIĘ I NAZWISKO -->

        <h1
          class="header-name
                 m-0
                 mt-3
                 block
                 w-full
                 min-w-0
                 max-w-full
                 whitespace-nowrap
                 text-center
                 font-normal
                 leading-tight
                 tracking-[-0.055em]
                 text-[var(--brand-burgundy)]
                 sm:mt-4"
          aria-label="Zbigniew Władysławski"
        >
          {{ bannerParts[1] }}
        </h1>


        <!-- NOTARIUSZ -->

        <p
          class="header-role
                m-0
                mt-3
                block
                w-full
                max-w-full
                whitespace-nowrap
                text-center
                font-normal
                uppercase
                tracking-[0.12em]
                text-stone-500
                sm:mt-4"
        >
          {{ bannerParts[2] }}
        </p>

      </div>

    </div>

  </div>
</header>
