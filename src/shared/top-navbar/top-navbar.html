<!-- NAVBAR -->

<nav
  class="relative
         w-full
         overflow-hidden
         border-y border-[#bda968]/30
         bg-[#eee8d9]
         shadow-[0_6px_20px_rgba(80,65,35,0.10)]"
>

  <!-- =========================================
       JEDNOLITE PREMIUM TŁO
       ========================================= -->

  <!-- SZEROKA, RÓWNOMIERNA ZŁOTA POŚWIATA -->

  <div
    class="pointer-events-none absolute inset-0
           bg-[radial-gradient(ellipse_140%_180%_at_50%_50%,rgba(190,168,104,0.15)_0%,rgba(190,168,104,0.11)_35%,rgba(190,168,104,0.07)_60%,rgba(190,168,104,0.035)_80%,transparent_100%)]"
    aria-hidden="true"
  ></div>


  <!-- DELIKATNE JASNE ROZŚWIETLENIE CAŁEGO PASKA -->

  <div
    class="pointer-events-none absolute inset-0
           bg-[linear-gradient(90deg,rgba(255,252,242,0.08)_0%,rgba(255,252,242,0.18)_25%,rgba(255,252,242,0.22)_50%,rgba(255,252,242,0.18)_75%,rgba(255,252,242,0.08)_100%)]"
    aria-hidden="true"
  ></div>


  <!-- BARDZO DELIKATNA CENTRALNA POŚWIATA -->

  <div
    class="pointer-events-none absolute
           left-1/2 top-1/2
           h-[100px] w-[850px]
           -translate-x-1/2
           -translate-y-1/2
           rounded-full
           bg-[#fffaf0]/[0.18]
           blur-3xl"
    aria-hidden="true"
  ></div>


  <!-- =========================================
       SUBTELNE ZŁOTE ŁUKI
       ========================================= -->

  <div
    class="pointer-events-none absolute
           -left-24 top-1/2
           h-[150px] w-[380px]
           -translate-y-1/2
           rounded-full
           border
           border-[#bda968]/[0.07]"
    aria-hidden="true"
  ></div>

  <div
    class="pointer-events-none absolute
           -right-24 top-1/2
           h-[150px] w-[380px]
           -translate-y-1/2
           rounded-full
           border
           border-[#bda968]/[0.07]"
    aria-hidden="true"
  ></div>


  <!-- =========================================
       DELIKATNA LINIA CENTRALNA
       ========================================= -->

  <div
    class="pointer-events-none absolute
           inset-x-[5%] top-1/2
           h-px
           -translate-y-1/2
           bg-[#bda968]/[0.055]"
    aria-hidden="true"
  ></div>


  <!-- =========================================
       KRAWĘDZIE
       ========================================= -->

  <div
    class="pointer-events-none absolute
           inset-x-0 top-0
           h-px
           bg-[#bda968]/[0.24]"
    aria-hidden="true"
  ></div>

  <div
    class="pointer-events-none absolute
           inset-x-0 bottom-0
           h-px
           bg-[#bda968]/[0.28]"
    aria-hidden="true"
  ></div>


  <!-- =========================================
       TREŚĆ
       ========================================= -->

  <div
    class="relative z-10
           mx-auto flex max-w-7xl"
  >

    <!-- STRONA GŁÓWNA -->

    <a
      href="#home"
      aria-label="Strona główna"
      class="group relative flex min-w-0 flex-1
             items-center justify-center
             px-2 py-3
             font-top-navbar
             text-[15px]
             font-normal
             tracking-wide
             text-stone-600
             transition-colors duration-300
             hover:text-[#806c3e]
             md:px-6 md:py-3.5
             md:text-[16px]
             after:absolute
             after:bottom-0
             after:left-1/2
             after:h-px
             after:w-0
             after:-translate-x-1/2
             after:bg-[#bda968]
             after:transition-all
             after:duration-300
             hover:after:w-full"
    >
      <span class="inline-flex items-center justify-center gap-2">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          class="h-[18px] w-[18px] shrink-0 md:h-4 md:w-4"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 10.5 12 3l9 7.5M5.5 9v11h13V9M9.5 20v-6h5v6"
          />
        </svg>

        <span class="hidden md:inline">
          Strona główna
        </span>

      </span>
    </a>

             font-normal

             text-stone-600
             transition-colors duration-300
             hover:text-[#806c3e]

             after:-translate-x-1/2
             after:bg-[#bda968]
             after:transition-all

        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          class="h-[18px] w-[18px] shrink-0 md:h-4 md:w-4"

          <path

             transition-colors duration-300
             hover:text-[#806c3e]
             md:px-6 md:py-3.5
             md:text-[16px]
             after:absolute

             after:left-1/2

             after:-translate-x-1/2
