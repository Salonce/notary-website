<section
  #contactInfoSection
  class="contact-info"
  [class.is-visible]="isContactInfoVisible"
>

  <!-- HEADER -->

  <div class="text-center">

    <h2
      class="contact-info-title
             mt-2
             font-['Source_Serif_4']
             text-[34px]
             font-normal
             tracking-wide
             text-stone-800
             md:text-[40px]"
    >
      Dane teleadresowe
    </h2>

    <div class="contact-info-divider">
      <app-section-divider />
    </div>

  </div>


  <!-- CONTENT -->

  <div
    class="contact-info-content
           mx-auto mt-10 max-w-xl
           space-y-9
           font-['Libre_Baskerville']
           text-[17px]
           font-normal
           leading-[1.85]
           text-stone-600
           md:mt-11
           md:space-y-10
           md:text-[18px]
           md:leading-[1.9]"
  >

    <!-- OFFICE -->

    <div>

      <p
        class="font-['Libre_Baskerville']
               text-[17px]
               font-normal
               leading-[1.7]
               text-stone-800
               md:text-[18px]"
      >
        Kancelaria Notarialna Zbigniew Władysławski Notariusz
      </p>

      <p
        class="mt-1
               font-['Libre_Baskerville']
               text-[14px]
               font-normal
               leading-6
               text-stone-500
               md:text-[15px]"
      >
        NIP 7393296744, REGON 281094049
      </p>

    </div>


    <!-- CONTACT DETAILS -->

    <div class="space-y-8 md:space-y-9">


      <!-- PHONE -->

      <div>

        <span
          class="mb-2 block
                 font-['Libre_Baskerville']
                 text-[12px]
                 font-normal
                 uppercase
                 tracking-[0.2em]
                 text-[#806c3e]"
        >
          Telefon
        </span>

        <div class="space-y-1">

          <a
            href="tel:895195656"
            class="block
                   font-['Inter']
                   text-[17px]
                   font-normal
                   tracking-wide
                   text-stone-700
                   transition-colors duration-300
                   hover:text-[#806c3e]
                   md:text-[18px]"
          >
            89 527 38 39
          </a>

        </div>

      </div>


      <!-- EMAIL -->

      <div>

        <span
          class="mb-2 block
                 font-['Libre_Baskerville']
                 text-[12px]
                 font-normal
                 uppercase
                 tracking-[0.2em]
                 text-[#806c3e]"
        >
          E-mail
        </span>

        <a
          href="mailto:poczta@notariusz-olsztyn.pl"
          class="block
                 break-all
                 font-['Libre_Baskerville']
                 text-[17px]
                 font-normal
                 leading-[1.7]
                 text-stone-700
                 transition-colors duration-300
                 hover:text-[#806c3e]
                 sm:break-normal
                 md:text-[18px]"
        >
          notariusz@wladyslawski.pl
        </a>

      </div>


      <!-- ADDRESS -->

      <div>

        <span
          class="mb-2 block
                 font-['Libre_Baskerville']
                 text-[12px]
                 font-normal
                 uppercase
                 tracking-[0.2em]
                 text-[#806c3e]"
        >
          Adres kancelarii
        </span>

        <a
          href="https://www.google.com/maps/place/Notariusz+Olsztyn+Maciej+Wróblewski+%E2%80%93+Kancelaria+Notarialna/@53.7790166,20.480165,17z"
          target="_blank"
          rel="noopener noreferrer"
          class="block
                 font-['Libre_Baskerville']
                 text-[17px]
                 font-normal
                 leading-[1.85]
                 tracking-wide
                 text-stone-700
                 transition-colors duration-300
                 hover:text-[#806c3e]
                 md:text-[18px]"
        >
          ul. Dąbrowszczaków 21 lok. 3
          <br />
          10-540 Olsztyn
        </a>

      </div>


      <!-- OPENING HOURS -->

      <div>

        <span
          class="mb-2 block
                 font-['Libre_Baskerville']
                 text-[12px]
                 font-normal
                 uppercase
                 tracking-[0.2em]
                 text-[#806c3e]"
        >
          Godziny otwarcia
        </span>

        <div class="space-y-1">

          <div
            class="flex max-w-sm
                   justify-between
                   gap-6
                   font-['Libre_Baskerville']
                   text-[17px]
                   font-normal
                   leading-[1.85]
                   md:text-[18px]
                   md:leading-[1.9]"
          >

            <span class="text-stone-600">
              Pon – Pt
            </span>

            <span
              class="font-normal
                     text-stone-700"
            >
              08:00 – 16:00
            </span>

          </div>

        </div>

      </div>

    </div>

  </div>

</section>
