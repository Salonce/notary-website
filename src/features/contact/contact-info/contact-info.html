<section
  #contactInfoSection
  class="contact-info"
  [class.is-visible]="isContactInfoVisible"
>
  <div class="text-center">
    <h2
      class="contact-info-title
             mt-2
             font-main-heading
             text-[34px]
             tracking-wide
             text-stone-800
             md:text-[40px]"
    >
      Dane teleadresowe
    </h2>

    <div class="contact-info-divider">
      <app-section-divider />
    </div>
  </div>

  <div
    class="contact-info-content
           mx-auto mt-10 max-w-xl
           space-y-6
           font-main-body
           text-[17px]
           leading-[1.85]
           text-stone-600
           md:mt-11
           md:space-y-7
           md:text-[18px]
           md:leading-[1.9]"
  >
    <!-- KANCELARIA -->
    <div>
      <p
        class="font-main-body
               text-[17px]
               font-semibold
               leading-[1.7]
               text-stone-800
               md:text-[18px]"
      >
        Kancelaria Notarialna Zbigniew Władysławski Notariusz
      </p>

      <p
        class="mt-1
               font-main-body
               text-[14px]
               leading-6
               text-stone-500
               md:text-[15px]"
      >
        NIP 7393296744, REGON 281094049
      </p>
    </div>

    <!-- DANE KONTAKTOWE -->
    <div class="space-y-5">

      <!-- TELEFON -->
      <div
        class="flex items-center gap-5
               rounded-2xl
               border border-stone-300
               bg-[#f7f4ec]/70
               px-5 py-4"
      >
        <div
          class="flex h-12 w-12 shrink-0 items-center justify-center
                 rounded-full
                 border-2 border-[#806c3e]/60
                 bg-[#f7f4ec]
                 text-[#806c3e]"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-7 w-7"
          >
            <path
              d="M5.5 3.5
                 h2.1
                 c.7 0 1.3.45 1.52 1.11
                 l.75 2.25
                 c.17.51.04 1.08-.34 1.46
                 L8.1 9.75
                 a15.7 15.7 0 0 0 6.15 6.15
                 l1.43-1.43
                 c.38-.38.95-.51 1.46-.34
                 l2.25.75
                 c.66.22 1.11.82 1.11 1.52
                 v2.1
                 c0 .83-.67 1.5-1.5 1.5
                 C10.49 20 4 13.51 4 5
                 c0-.83.67-1.5 1.5-1.5Z"
            />
          </svg>
        </div>

        <div>
          <span
            class="mb-1 block
                   font-main-body
                   text-[12px]
                   uppercase
                   tracking-[0.2em]
                   text-[#806c3e]"
          >
            Telefon
          </span>

          <p
            class="font-main-body
                   text-[17px]
                   tracking-wide
                   text-stone-700
                   md:text-[18px]"
          >
            89 527 38 39
          </p>
        </div>
      </div>

      <!-- E-MAIL -->
      <div
        class="flex items-center gap-5
               rounded-2xl
               border border-stone-300
               bg-[#f7f4ec]/70
               px-5 py-4"
      >
        <div
          class="flex h-12 w-12 shrink-0 items-center justify-center
                 rounded-full
                 border-2 border-[#806c3e]/60
                 bg-[#f7f4ec]
                 text-[#806c3e]"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-7 w-7"
          >
            <rect
              x="3"
              y="5"
              width="18"
              height="14"
              rx="2"
            />
            <path d="m4 7 8 6 8-6" />
          </svg>
        </div>

        <div>
          <span
            class="mb-1 block
                   font-main-body
                   text-[12px]
                   uppercase
                   tracking-[0.2em]
                   text-[#806c3e]"
          >
            E-mail
          </span>

          <p
            class="font-main-body
                   text-[17px]
                   leading-[1.7]
                   text-stone-700
                   md:text-[18px]"
          >
            notariusz@wladyslawski.pl
          </p>
        </div>
      </div>

      <!-- ADRES -->
      <div
        class="flex items-center gap-5
               rounded-2xl
               border border-stone-300
               bg-[#f7f4ec]/70
               px-5 py-4"
      >
        <div
          class="flex h-12 w-12 shrink-0 items-center justify-center
                 rounded-full
                 border-2 border-[#806c3e]/60
                 bg-[#f7f4ec]
                 text-[#806c3e]"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-7 w-7"
          >
            <path
              d="M20 10.5
                 c0 5.5-8 10-8 10s-8-4.5-8-10
                 a8 8 0 1 1 16 0Z"
            />
            <circle cx="12" cy="10.5" r="2.5" />
          </svg>
        </div>

        <div>
          <span
            class="mb-1 block
                   font-main-body
                   text-[12px]
                   uppercase
                   tracking-[0.2em]
                   text-[#806c3e]"
          >
            Adres kancelarii
          </span>

          <p
            class="font-main-body
                   text-[17px]
                   leading-[1.7]
                   tracking-wide
                   text-stone-700
                   md:text-[18px]"
          >
            ul. Dąbrowszczaków 21 lok. 3
            <br />
            10-540 Olsztyn
          </p>
        </div>
      </div>

      <!-- GODZINY OTWARCIA -->
      <div
        class="flex items-center gap-5
               rounded-2xl
               border border-stone-300
               bg-[#f7f4ec]/70
               px-5 py-4"
      >
        <div
          class="flex h-12 w-12 shrink-0 items-center justify-center
                 rounded-full
                 border-2 border-[#806c3e]/60
                 bg-[#f7f4ec]
                 text-[#806c3e]"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-7 w-7"
          >
            <circle cx="12" cy="12" r="8.5" />
            <path d="M12 7.5v5l3 2" />
          </svg>
        </div>

        <div class="w-full">
          <span
            class="mb-1 block
                   font-main-body
                   text-[12px]
                   uppercase
                   tracking-[0.2em]
                   text-[#806c3e]"
          >
            Godziny otwarcia
          </span>

          <div
            class="flex items-center justify-between
                   gap-6
                   font-main-body
                   text-[17px]
                   md:text-[18px]"
          >
            <span class="text-stone-600">
              Pon – Pt
            </span>

            <span
              class="font-medium
                     tracking-wide
                     text-stone-800"
            >
              08:00 – 16:00
            </span>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
