<section
  #contactFormSection
  class="contact-form"
  [class.is-visible]="isContactFormVisible"
>
  <!-- HEADER -->
  <div class="text-center">
    <h2
      class="contact-form-title
             mt-2
             font-main-heading
             text-[34px]
             md:text-[40px]
             font-normal
             tracking-wide
             text-stone-800"
    >
      Formularz kontaktowy
    </h2>

    <div class="contact-form-divider">
      <app-title-divider />
    </div>
  </div>

  <!-- FORM -->
  <form
    [formGroup]="contactForm"
    (ngSubmit)="onSubmit()"
    class="contact-form-body
           mx-auto mt-10
           w-full max-w-xl
           space-y-5
           font-main-body
           md:mt-12
           md:space-y-6"
  >
    <!-- IMIĘ I NAZWISKO -->
    <div>
      <label
        for="name"
        class="mb-2 block
               font-main-body
               text-[12px]
               font-normal
               uppercase
               tracking-[0.2em]
               text-[#806c3e]"
      >
        Imię i nazwisko
      </label>

      <input
        id="name"
        formControlName="name"
        type="text"
        autocomplete="name"
        placeholder="Jan Kowalski"
        class="w-full
               border border-[#d8ccb0]
               bg-[#f3f0e7]/40
               px-4 py-3
               font-main-body
               text-[17px]
               font-normal
               leading-[1.7]
               text-stone-800
               outline-none
               transition-all duration-300
               placeholder:text-stone-400
               hover:border-[#b59b5b]
               focus:border-[#806c3e]
               focus:ring-1
               focus:ring-[#d8ccb0]
               md:text-[18px]"
      />
    </div>

    <!-- ADRES E-MAIL -->
    <div>
      <label
        for="email"
        class="mb-2 block
               font-main-body
               text-[12px]
               font-normal
               uppercase
               tracking-[0.2em]
               text-[#806c3e]"
      >
        Adres e-mail
      </label>

      <input
        id="email"
        formControlName="email"
        type="email"
        autocomplete="email"
        placeholder="jan.kowalski@email.pl"
        class="w-full
               border border-[#d8ccb0]
               bg-[#f3f0e7]/40
               px-4 py-3
               font-main-body
               text-[17px]
               font-normal
               leading-[1.7]
               text-stone-800
               outline-none
               transition-all duration-300
               placeholder:text-stone-400
               hover:border-[#b59b5b]
               focus:border-[#806c3e]
               focus:ring-1
               focus:ring-[#d8ccb0]
               md:text-[18px]"
      />
    </div>

    <!-- TREŚĆ ZAPYTANIA -->
    <div>
      <label
        for="message"
        class="mb-2 block
               font-main-body
               text-[12px]
               font-normal
               uppercase
               tracking-[0.2em]
               text-[#806c3e]"
      >
        Treść zapytania
      </label>

      <textarea
        id="message"
        formControlName="message"
        rows="5"
        placeholder="W czym możemy Państwu pomóc?"
        class="w-full
               resize-none
               border border-[#d8ccb0]
               bg-[#f3f0e7]/40
               px-4 py-3
               font-main-body
               text-[17px]
               font-normal
               leading-[1.85]
               text-stone-800
               outline-none
               transition-all duration-300
               placeholder:text-stone-400
               hover:border-[#b59b5b]
               focus:border-[#806c3e]
               focus:ring-1
               focus:ring-[#d8ccb0]
               md:text-[18px]
               md:leading-[1.9]"
      ></textarea>
    </div>

    <!-- ZGODA -->
    <div class="pt-1">
      <label
        for="consent"
        class="flex cursor-pointer items-start gap-3"
      >
        <input
          id="consent"
          formControlName="consent"
          type="checkbox"
          class="mt-1
                 h-4 w-4
                 shrink-0
                 cursor-pointer
                 accent-[#806c3e]"
          [attr.aria-invalid]="
            contactForm.controls.consent.touched &&
            contactForm.controls.consent.invalid
              ? 'true'
              : null
          "
          [attr.aria-describedby]="
            contactForm.controls.consent.touched &&
            contactForm.controls.consent.invalid
              ? 'consent-error'
              : null
          "
        />

        <span
          class="font-main-body
                 text-[13px]
                 font-normal
                 leading-6
                 text-stone-500
                 md:text-[14px]"
        >
          Wyrażam zgodę na przetwarzanie moich danych osobowych
          w celu przetworzenia zapytania. Administratorem danych
          osobowych jest Kancelaria Notarialna Zbigniewa Władysławskiego.
        </span>
      </label>

      <!-- CONSENT VALIDATION MESSAGE -->
      @if (
        contactForm.controls.consent.touched &&
        contactForm.controls.consent.invalid
      ) {
        <div
          id="consent-error"
          class="mt-3 flex items-start gap-3
                 border-l-2 border-[#b59b5b]
                 bg-[#f8f5ee]
                 px-4 py-3"
          role="alert"
        >
          <svg
            class="mt-0.5 h-4 w-4 shrink-0 text-[#806c3e]"
            viewBox="0 0 20 20"
            fill="none"
            aria-hidden="true"
          >
            <circle
              cx="10"
              cy="10"
              r="7.5"
              stroke="currentColor"
              stroke-width="1.4"
            />
            <path
              d="M10 9v4"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
            <circle
              cx="10"
              cy="6.5"
              r="0.8"
              fill="currentColor"
            />
          </svg>

          <div class="min-w-0">
            <p
              class="font-main-body
                     text-[12px]
                     font-medium
                     uppercase
                     tracking-[0.12em]
                     text-[#806c3e]"
            >
              Wymagane potwierdzenie
            </p>

            <p
              class="mt-1
                     font-main-body
                     text-[13px]
                     font-normal
                     leading-[1.7]
                     text-stone-600"
            >
              Prosimy o zaznaczenie zgody, aby móc wysłać formularz kontaktowy.
            </p>
          </div>
        </div>
      }
    </div>

    <!-- SUCCESS MESSAGE -->
    @if (successMessage) {
      <div
        class="pt-1
               font-main-body
               text-[14px]
               font-normal
               leading-7
               text-stone-600
               md:text-[15px]"
        role="status"
      >
        {{ successMessage }}
      </div>
    }

    <!-- ERROR MESSAGE -->
    @if (errorMessage) {
      <div
        class="pt-1
               font-main-body
               text-[14px]
               font-normal
               leading-7
               text-red-700
               md:text-[15px]"
        role="alert"
      >
        {{ errorMessage }}
      </div>
    }

    <!-- BUTTON -->
    <div class="pt-1">
      <button
        type="submit"
        [disabled]="isSending"
        class="group inline-flex
               w-full
               items-center
               justify-center
               gap-4
               border border-[#d8ccb0]
               bg-transparent
               px-6 py-3
               font-main-body
               text-[14px]
               font-normal
               tracking-wide
               text-[#806c3e]
               transition-all duration-300
               hover:border-[#806c3e]
               hover:bg-[#806c3e]
               hover:text-white
               disabled:cursor-not-allowed
               disabled:opacity-50
               sm:w-auto"
      >
        <span>
          {{ isSending ? 'Wysyłanie...' : 'Wyślij zapytanie' }}
        </span>

        @if (!isSending) {
          <span
            class="text-[#b59b5b]
                   transition-transform duration-300
                   group-hover:translate-x-1
                   group-hover:text-white"
            aria-hidden="true"
          >
            →
          </span>
        }
      </button>
    </div>
  </form>
</section>
