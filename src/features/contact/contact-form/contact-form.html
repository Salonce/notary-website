<section
  #contactFormSection
  class="contact-form"
  [class.is-visible]="isContactFormVisible"
>

  <!-- HEADER -->

  <div class="text-center">

    <h2
      class="contact-form-title
             mt-2
             font-main-heading
             text-[34px]
             font-normal
             tracking-wide
             text-stone-800
             md:text-[40px]"
    >
      Formularz kontaktowy
    </h2>

    <div class="contact-form-divider">
      <app-section-divider />
    </div>

  </div>


  <!-- FORM -->

  <form
    [formGroup]="contactForm"
    (ngSubmit)="onSubmit()"
    class="contact-form-body
           mx-auto mt-10
           w-full max-w-xl
           space-y-5
           font-main-body
           md:mt-12
           md:space-y-6"
  >

    <!-- IMIĘ I NAZWISKO -->

    <div>

      <label
        for="name"
        class="mb-2 block
               font-main-body
               text-[12px]
               font-normal
               uppercase
               tracking-[0.2em]
               text-[#806c3e]"
      >
        Imię i nazwisko
      </label>

      <input
        id="name"
        formControlName="name"
        type="text"
        autocomplete="name"
        placeholder="Jan Kowalski"
        class="w-full
               border border-[#d8ccb0]
               bg-[#f3f0e7]/40
               px-4 py-3
               font-main-body
               text-[17px]
               font-normal
               leading-[1.7]
               text-stone-800
               outline-none
               transition-all duration-300
               placeholder:text-stone-400
               hover:border-[#b59b5b]
               focus:border-[#806c3e]
               focus:ring-1
               focus:ring-[#d8ccb0]
               md:text-[18px]"
      />

    </div>


    <!-- ADRES E-MAIL -->

    <div>

      <label
        for="email"
        class="mb-2 block
               font-main-body
               text-[12px]
               font-normal
               uppercase
               tracking-[0.2em]
               text-[#806c3e]"
      >
        Adres e-mail
      </label>

      <input
        id="email"
        formControlName="email"
        type="email"
        autocomplete="email"
        placeholder="jan.kowalski@email.pl"
        class="w-full
               border border-[#d8ccb0]
               bg-[#f3f0e7]/40
               px-4 py-3
               font-main-body
               text-[17px]
               font-normal
               leading-[1.7]
               text-stone-800
               outline-none
               transition-all duration-300
               placeholder:text-stone-400
               hover:border-[#b59b5b]
               focus:border-[#806c3e]
               focus:ring-1
               focus:ring-[#d8ccb0]
               md:text-[18px]"
      />

    </div>


    <!-- TREŚĆ ZAPYTANIA -->

    <div>

      <label
        for="message"
        class="mb-2 block
               font-main-body
               text-[12px]
               font-normal
               uppercase
               tracking-[0.2em]
               text-[#806c3e]"
      >
        Treść zapytania
      </label>

      <textarea
        id="message"
        formControlName="message"
        rows="5"
        placeholder="W czym możemy Państwu pomóc?"
        class="w-full
               resize-none
               border border-[#d8ccb0]
               bg-[#f3f0e7]/40
               px-4 py-3
               font-main-body
               text-[17px]
               font-normal
               leading-[1.85]
               text-stone-800
               outline-none
               transition-all duration-300
               placeholder:text-stone-400
               hover:border-[#b59b5b]
               focus:border-[#806c3e]
               focus:ring-1
               focus:ring-[#d8ccb0]
               md:text-[18px]
               md:leading-[1.9]"
      ></textarea>

    </div>


    <!-- ZGODA -->

    <div class="pt-1">

      <label
        class="flex cursor-pointer
               items-start
               gap-3"
      >

        <input
          id="consent"
          formControlName="consent"
          type="checkbox"
          class="mt-1
                 h-4 w-4
                 shrink-0
                 cursor-pointer
                 accent-[#806c3e]"
        />

        <span
          class="font-main-body
                 text-[13px]
                 font-normal
                 leading-6
                 text-stone-500
                 md:text-[14px]"
        >
          Wyrażam zgodę na przetwarzanie moich danych osobowych
          w celu przetworzenia zapytania. Administratorem danych
          osobowych jest Kancelaria Notarialna Zbigniewa Władysławskiego.
        </span>

      </label>

    </div>


    <!-- MESSAGES -->

    @if (successMessage) {

      <div
        class="pt-1
               font-main-body
               text-[14px]
               font-normal
               leading-7
               text-stone-600
               md:text-[15px]"
      >
        {{ successMessage }}
      </div>

    }

    @if (errorMessage) {

      <div
        class="pt-1
               font-main-body
               text-[14px]
               font-normal
               leading-7
               text-red-700
               md:text-[15px]"
      >
        {{ errorMessage }}
      </div>

    }


    <!-- BUTTON -->

    <div class="pt-1">

      <button
        type="submit"
        [disabled]="isSending"
        class="group inline-flex
               w-full
               items-center
               justify-center
               gap-4
               border border-[#d8ccb0]
               bg-transparent
               px-6 py-3
               font-main-body
               text-[14px]
               font-normal
               tracking-wide
               text-[#806c3e]
               transition-all duration-300
               hover:border-[#806c3e]
               hover:bg-[#806c3e]
               hover:text-white
               disabled:cursor-not-allowed
               disabled:opacity-50
               sm:w-auto"
      >

        <span>
          {{ isSending ? 'Wysyłanie...' : 'Wyślij zapytanie' }}
        </span>

        @if (!isSending) {

          <span
            class="text-[#b59b5b]
                   transition-transform duration-300
                   group-hover:translate-x-1
                   group-hover:text-white"
            aria-hidden="true"
          >
            →
          </span>

        }

      </button>

    </div>

  </form>

</section>
