<section class="contact-form">

  <!-- HEADER -->

  <div class="text-center">

    <h2
      class="mt-2
             font-['Cormorant_Garamond']
             text-[32px]
             font-medium
             tracking-wide
             text-stone-800
             md:text-[36px]"
    >
      Wypełnij formularz<br />
      kontaktowy
    </h2>

    <div
      class="mx-auto mt-4 h-px w-14
             bg-[#b59b5b]"
    ></div>

  </div>


  <!-- FORM -->

  <form
    [formGroup]="contactForm"
    (ngSubmit)="onSubmit()"
    class="mx-auto mt-10
           w-full max-w-xl
           space-y-4
           font-['Lora']
           md:mt-12"
  >

    <!-- IMIĘ I NAZWISKO -->

    <div>

      <label
        for="name"
        class="mb-1.5 block
               font-['Lora']
               text-[10px]
               font-medium
               uppercase
               tracking-[0.2em]
               text-[#806c3e]"
      >
        Imię i nazwisko
      </label>

      <input
        id="name"
        formControlName="name"
        type="text"
        autocomplete="name"
        placeholder="Jan Kowalski"
        class="w-full
               border border-[#d8ccb0]
               bg-[#f3f0e7]/40
               px-4 py-2.5
               font-['Lora']
               text-[15px]
               text-stone-800
               outline-none
               transition-all duration-300
               placeholder:text-stone-400
               hover:border-[#b59b5b]
               focus:border-[#806c3e]
               focus:ring-1
               focus:ring-[#d8ccb0]"
      />

    </div>


    <!-- ADRES E-MAIL -->

    <div>

      <label
        for="email"
        class="mb-1.5 block
               font-['Lora']
               text-[10px]
               font-medium
               uppercase
               tracking-[0.2em]
               text-[#806c3e]"
      >
        Adres e-mail
      </label>

      <input
        id="email"
        formControlName="email"
        type="email"
        autocomplete="email"
        placeholder="jan.kowalski@email.pl"
        class="w-full
               border border-[#d8ccb0]
               bg-[#f3f0e7]/40
               px-4 py-2.5
               font-['Lora']
               text-[15px]
               text-stone-800
               outline-none
               transition-all duration-300
               placeholder:text-stone-400
               hover:border-[#b59b5b]
               focus:border-[#806c3e]
               focus:ring-1
               focus:ring-[#d8ccb0]"
      />

    </div>


    <!-- TREŚĆ ZAPYTANIA -->

    <div>

      <label
        for="message"
        class="mb-1.5 block
               font-['Lora']
               text-[10px]
               font-medium
               uppercase
               tracking-[0.2em]
               text-[#806c3e]"
      >
        Treść zapytania
      </label>

      <textarea
        id="message"
        formControlName="message"
        rows="5"
        placeholder="W czym możemy Państwu pomóc?"
        class="w-full
               resize-none
               border border-[#d8ccb0]
               bg-[#f3f0e7]/40
               px-4 py-2.5
               font-['Lora']
               text-[15px]
               leading-7
               text-stone-800
               outline-none
               transition-all duration-300
               placeholder:text-stone-400
               hover:border-[#b59b5b]
               focus:border-[#806c3e]
               focus:ring-1
               focus:ring-[#d8ccb0]"
      ></textarea>

    </div>


    <!-- ZGODA -->

    <div class="pt-1">

      <label
        class="flex cursor-pointer
               items-start
               gap-3"
      >

        <input
          id="consent"
          formControlName="consent"
          type="checkbox"
          class="mt-1
                 h-4 w-4
                 shrink-0
                 cursor-pointer
                 accent-[#806c3e]"
        />

        <span
          class="font-['Lora']
                 text-[12px]
                 leading-5
                 text-stone-500"
        >
          Wyrażam zgodę na przetwarzanie moich danych osobowych
          w celu przetworzenia zapytania. Administratorem danych
          osobowych jest Kancelaria Notarialna Zbigniewa Władysławskiego.
        </span>

      </label>

    </div>


    <!-- MESSAGES -->

    @if (successMessage) {

      <div
        class="pt-1
               font-['Lora']
               text-[13px]
               leading-6
               text-stone-600"
      >
        {{ successMessage }}
      </div>

    }

    @if (errorMessage) {

      <div
        class="pt-1
               font-['Lora']
               text-[13px]
               leading-6
               text-red-700"
      >
        {{ errorMessage }}
      </div>

    }


    <!-- BUTTON -->

    <div class="pt-1">

      <button
        type="submit"
        [disabled]="isSending"
        class="group inline-flex
               w-full
               items-center
               justify-center
               gap-4
               border border-[#d8ccb0]
               bg-transparent
               px-6 py-2.5
               font-['Lora']
               text-[14px]
               font-medium
               text-[#806c3e]
               transition-all duration-300
               hover:border-[#806c3e]
               hover:bg-[#806c3e]
               hover:text-white
               disabled:cursor-not-allowed
               disabled:opacity-50
               sm:w-auto"
      >

        <span>
          {{ isSending ? 'Wysyłanie...' : 'Wyślij zapytanie' }}
        </span>

        @if (!isSending) {

          <span
            class="text-[#b59b5b]
                   transition-transform duration-300
                   group-hover:translate-x-1
                   group-hover:text-white"
            aria-hidden="true"
          >
            →
          </span>

        }

      </button>

    </div>

  </form>

</section>
