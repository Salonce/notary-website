<header
  class="header-kancelaria relative
         h-[31px] max-h-[31px]
         w-full
         overflow-hidden
         border-b border-[var(--brand-gold)]/40
         bg-[var(--brand-burgundy-soft)]
         [@media(min-width:1024px)_and_(min-height:900px)]:h-[38px]
         [@media(min-width:1024px)_and_(min-height:900px)]:max-h-[38px]"
>
  <!-- SUBTELNE ORNAMENTY KONTUROWE -->
  <div class="header-ornament pointer-events-none absolute -left-24 -top-28 h-[240px] w-[240px] rounded-full border" aria-hidden="true"></div>
  <div class="header-ornament pointer-events-none absolute -left-12 -top-16 h-[170px] w-[170px] rounded-full border" aria-hidden="true"></div>
  <div class="header-ornament pointer-events-none absolute -right-24 -bottom-28 h-[240px] w-[240px] rounded-full border" aria-hidden="true"></div>
  <div class="header-ornament pointer-events-none absolute -right-12 -bottom-16 h-[170px] w-[170px] rounded-full border" aria-hidden="true"></div>

  <!-- LEKKI WZÓR GEOMETRYCZNY -->
  <div class="pointer-events-none absolute inset-0 opacity-20" aria-hidden="true">
    <div class="absolute inset-0 bg-[linear-gradient(135deg,transparent_0%,transparent_48%,rgba(var(--brand-gold-rgb),0.07)_49%,transparent_50%,transparent_100%)]"></div>
    <div class="absolute inset-0 bg-[linear-gradient(45deg,transparent_0%,transparent_48%,rgba(var(--brand-gold-rgb),0.045)_49%,transparent_50%,transparent_100%)]"></div>
  </div>

  <!-- TREŚĆ -->
  <div
    class="relative z-10
           mx-auto flex h-[30px] max-h-[30px]
           max-w-7xl
           items-center justify-between
           overflow-hidden
           px-3
           max-[359px]:px-2
           sm:px-6
           [@media(min-width:1024px)_and_(min-height:900px)]:h-[37px]
           [@media(min-width:1024px)_and_(min-height:900px)]:max-h-[37px]"
  >

    <!-- MOBILE -->
    <div
      class="flex h-full w-full
             items-center
             justify-between
             gap-3
             max-[359px]:gap-1.5
             md:hidden"
    >
      <!-- ADRES -->
      <div
        class="flex min-w-0 flex-1
               items-center gap-2
               max-[359px]:gap-1"
      >
        <i
          class="fa-solid fa-house
                 hidden sm:inline-block
                 shrink-0
                 text-[11px]
                 text-[var(--brand-gold)]"
          aria-hidden="true"
        ></i>

        <!-- ADRES PONIŻEJ 480 PX -->
        <span
          class="min-w-0 truncate
                 text-left
                 font-top-bar
                 text-[11px]
                 font-normal
                 leading-none
                 tracking-normal
                 text-[#f7f3eb]
                 max-[479px]:inline
                 min-[480px]:hidden"
        >
          Olsztyn, Dąbrowszczaków 21 lok.3
        </span>

        <!-- ADRES OD 480 PX -->
        <span
          class="min-w-0 truncate
                 text-left
                 font-top-bar
                 text-[11px]
                 font-normal
                 leading-none
                 tracking-normal
                 text-[#f7f3eb]
                 hidden min-[480px]:inline"
        >
          Olsztyn, ul. Dąbrowszczaków 21 lok. 3
        </span>
      </div>

      <!-- TELEFON -->
      <div
        class="flex shrink-0
               items-center gap-1.5
               max-[359px]:gap-1
               whitespace-nowrap
               font-top-bar
               text-[11px]
               font-normal
               leading-none
               tracking-normal
               text-[#f7f3eb]"
      >
        <i
          class="fa-solid fa-phone
                 text-[11px]
                 text-[var(--brand-gold)]"
          aria-hidden="true"
        ></i>

        <span>89 527 38 39</span>
      </div>
    </div>

    <!-- DESKTOP -->
    <div
      class="hidden h-full w-full
             items-center
             justify-between
             md:flex"
    >
      <!-- ADRES: MD 768–1023 PX -->
      <div
        class="hidden md:flex lg:hidden
               items-center gap-2"
      >
        <i
          class="fa-solid fa-house
                 text-[11px]
                 text-[var(--brand-gold)]"
          aria-hidden="true"
        ></i>

        <span
          class="whitespace-nowrap
                 font-top-bar
                 text-[12px]
                 font-normal
                 leading-none
                 tracking-normal
                 text-[#f7f3eb]"
        >
          Olsztyn, ul. Dąbrowszczaków 21 lok. 3
        </span>
      </div>

      <!-- ADRES: LG OD 1024 PX -->
      <div
        class="hidden lg:flex
               items-center gap-2
               [@media(min-width:1024px)_and_(min-height:900px)]:gap-3"
      >
        <i
          class="fa-solid fa-house
                 text-[11px]
                 text-[var(--brand-gold)]
                 [@media(min-width:1024px)_and_(min-height:900px)]:text-[14px]"
          aria-hidden="true"
        ></i>

        <span
          class="whitespace-nowrap
                 font-top-bar
                 text-[12px]
                 font-normal
                 leading-none
                 tracking-normal
                 text-[#f7f3eb]
                 [@media(min-width:1024px)_and_(min-height:900px)]:text-[14px]"
        >
          10-540 Olsztyn, ul. Dąbrowszczaków 21 lok. 3
        </span>
      </div>

      <!-- TELEFON I E-MAIL -->
      <div
        class="flex items-center gap-5
               [@media(min-width:1024px)_and_(min-height:900px)]:gap-8"
      >
        <!-- TELEFON -->
        <div
          class="flex items-center gap-2
                 whitespace-nowrap
                 font-top-bar
                 text-[12px]
                 font-normal
                 leading-none
                 tracking-normal
                 text-[#f7f3eb]
                 [@media(min-width:1024px)_and_(min-height:900px)]:text-[14px]
                 [@media(min-width:1024px)_and_(min-height:900px)]:gap-3"
        >
          <i
            class="fa-solid fa-phone
                   text-[11px]
                   text-[var(--brand-gold)]
                   [@media(min-width:1024px)_and_(min-height:900px)]:text-[14px]"
            aria-hidden="true"
          ></i>

          <span>89 527 38 39</span>
        </div>

        <!-- E-MAIL -->
        <div
          class="flex items-center gap-2
                 whitespace-nowrap
                 font-top-bar
                 text-[12px]
                 font-normal
                 leading-none
                 tracking-normal
                 text-[#f7f3eb]
                 [@media(min-width:1024px)_and_(min-height:900px)]:text-[14px]
                 [@media(min-width:1024px)_and_(min-height:900px)]:gap-3"
        >
          <i
            class="fa-solid fa-envelope
                   text-[11px]
                   text-[var(--brand-gold)]
                   [@media(min-width:1024px)_and_(min-height:900px)]:text-[14px]"
            aria-hidden="true"
          ></i>

          <span>notariusz@wladyslawski.pl</span>
        </div>
      </div>
    </div>
  </div>
</header>
