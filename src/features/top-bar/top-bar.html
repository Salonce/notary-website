<header
  class="header-kancelaria relative
         w-full
         overflow-hidden
         border-b border-[#c5a46d]/40
         bg-[#872a3d]"
>
  <!-- TŁO — SUBTELNE ZŁOTE OŚWIETLENIE -->
  <div
    class="header-glow pointer-events-none absolute inset-0
           bg-[radial-gradient(ellipse_125%_180%_at_50%_45%,rgba(197,164,109,0.13)_0%,rgba(197,164,109,0.075)_28%,rgba(197,164,109,0.045)_52%,rgba(197,164,109,0.018)_74%,transparent_100%)]"
    aria-hidden="true"
  ></div>

  <!-- JASNE CENTRALNE ROZŚWIETLENIE -->
  <div
    class="header-glow pointer-events-none absolute inset-0
           bg-[radial-gradient(ellipse_120%_125%_at_50%_-15%,rgba(255,253,245,0.12)_0%,rgba(255,251,238,0.075)_30%,rgba(255,249,232,0.04)_54%,rgba(255,247,225,0.012)_72%,transparent_90%)]"
    aria-hidden="true"
  ></div>

  <!-- 3 DELIKATNE STREFY -->
  <div
    class="header-glow pointer-events-none absolute
           left-[-10%] -top-[85%]
           h-[280px] w-[50%]
           rounded-full
           bg-[#c5a46d]/[0.045]
           blur-3xl"
    aria-hidden="true"
  ></div>

  <div
    class="header-glow pointer-events-none absolute
           left-[25%] -top-[110%]
           h-[320px] w-[50%]
           rounded-full
           bg-[#c5a46d]/[0.06]
           blur-3xl"
    aria-hidden="true"
  ></div>

  <div
    class="header-glow pointer-events-none absolute
           right-[-10%] -top-[85%]
           h-[280px] w-[50%]
           rounded-full
           bg-[#c5a46d]/[0.045]
           blur-3xl"
    aria-hidden="true"
  ></div>

  <!-- DELIKATNA POŚWIATA WZDŁUŻ PASKA -->
  <div
    class="header-glow pointer-events-none absolute
           inset-x-[8%] top-[18%]
           h-[90px]
           rounded-full
           bg-[#d5b77f]/[0.035]
           blur-3xl"
    aria-hidden="true"
  ></div>

  <!-- SZEROKIE ORNAMENTY — LEWY -->
  <div
    class="header-ornament pointer-events-none absolute
           -left-32 -top-32
           h-[300px] w-[300px]
           rounded-full
           border"
    aria-hidden="true"
  ></div>

  <div
    class="header-ornament pointer-events-none absolute
           -left-20 -top-20
           h-[240px] w-[240px]
           rounded-full
           border"
    aria-hidden="true"
  ></div>

  <div
    class="header-ornament pointer-events-none absolute
           -left-8 -top-8
           h-[165px] w-[165px]
           rounded-full
           border"
    aria-hidden="true"
  ></div>

  <!-- SZEROKIE ORNAMENTY — PRAWY -->
  <div
    class="header-ornament pointer-events-none absolute
           -right-32 -bottom-32
           h-[300px] w-[300px]
           rounded-full
           border"
    aria-hidden="true"
  ></div>

  <div
    class="header-ornament pointer-events-none absolute
           -right-20 -bottom-20
           h-[240px] w-[240px]
           rounded-full
           border"
    aria-hidden="true"
  ></div>

  <div
    class="header-ornament pointer-events-none absolute
           -right-8 -bottom-8
           h-[165px] w-[165px]
           rounded-full
           border"
    aria-hidden="true"
  ></div>

  <!-- DŁUGIE ŁUKI -->
  <div
    class="header-ornament pointer-events-none absolute
           left-[5%] top-1/2
           h-[180px] w-[650px]
           -translate-y-1/2
           rounded-full
           border"
    aria-hidden="true"
  ></div>

  <div
    class="header-ornament pointer-events-none absolute
           right-[5%] top-1/2
           h-[180px] w-[650px]
           -translate-y-1/2
           rounded-full
           border"
    aria-hidden="true"
  ></div>

  <!-- DELIKATNA SIATKA -->
  <div
    class="pointer-events-none absolute inset-0 opacity-20"
    aria-hidden="true"
  >
    <div
      class="absolute inset-0
             bg-[linear-gradient(135deg,transparent_0%,transparent_46%,rgba(197,164,109,0.07)_48%,transparent_50%,transparent_100%)]"
    ></div>

    <div
      class="absolute inset-0
             bg-[linear-gradient(45deg,transparent_0%,transparent_46%,rgba(197,164,109,0.045)_48%,transparent_50%,transparent_100%)]"
    ></div>
  </div>

  <!-- DELIKATNE LINIE KRAWĘDZIOWE -->
  <div
    class="header-line pointer-events-none absolute
           inset-x-0 top-0
           h-px"
    aria-hidden="true"
  ></div>

  <div
    class="header-line pointer-events-none absolute
           inset-x-0 bottom-0
           h-px"
    aria-hidden="true"
  ></div>

  <!-- TREŚĆ -->
  <div
    class="relative z-10
           mx-auto flex max-w-7xl
           items-center justify-between
           px-3 py-2.5
           max-[359px]:px-2
           sm:px-6"
  >
    <!-- MOBILE: ADRES PO LEWEJ, TELEFON PO PRAWEJ -->
    <div
      class="flex w-full
             h-5
             items-center
             justify-between
             gap-3
             max-[359px]:gap-1.5
             md:hidden"
    >
      <!-- ADRES -->
      <div
        class="flex min-w-0 flex-1
               h-5
               items-center gap-2
               max-[359px]:gap-1"
      >
        <i
          class="fa-solid fa-house
                 hidden sm:inline-block
                 shrink-0
                 text-[13px]
                 max-[359px]:text-[12px]
                 text-[#d5b77f]"
          aria-hidden="true"
        ></i>

        <!-- ADRES PONIŻEJ 480 PX -->
        <span
          class="min-w-0 truncate
                 text-left
                 font-top-bar
                 text-[12px]
                 max-[359px]:text-[11px]
                 font-normal
                 leading-5
                 max-[359px]:leading-4
                 tracking-wide
                 max-[359px]:tracking-normal
                 text-[#f7f3eb]
                 max-[479px]:inline
                 min-[480px]:hidden"
        >
          Olsztyn, Dąbrowszczaków 21/3
        </span>

        <!-- ADRES OD 480 PX WŁĄCZNIE -->
        <span
          class="min-w-0 truncate
                 text-left
                 font-top-bar
                 text-[12px]
                 max-[359px]:text-[11px]
                 font-normal
                 leading-5
                 max-[359px]:leading-4
                 tracking-wide
                 max-[359px]:tracking-normal
                 text-[#f7f3eb]
                 hidden min-[480px]:inline"
        >
          Olsztyn, ul. Dąbrowszczaków 21/3
        </span>
      </div>

      <!-- TELEFON PO PRAWEJ -->
      <a
        href="tel:+48895273839"
        class="flex shrink-0
               h-5
               items-center gap-2
               max-[359px]:gap-1
               whitespace-nowrap
               font-top-bar
               text-[12px]
               max-[359px]:text-[11px]
               font-normal
               tracking-wide
               max-[359px]:tracking-normal
               text-[#f7f3eb]
               transition-colors
               hover:text-white"
      >
        <i
          class="fa-solid fa-phone
                 text-[13px]
                 max-[359px]:text-[12px]
                 text-[#d5b77f]"
          aria-hidden="true"
        ></i>

        <span>89 527 38 39</span>
      </a>
    </div>

    <!-- DESKTOP -->
    <div
      class="hidden w-full
             items-center
             justify-between
             md:flex"
    >
      <!-- ADRES: MD 768–1023 PX -->
      <div
        class="hidden md:flex lg:hidden
               items-center gap-3"
      >
        <i
          class="fa-solid fa-house
                 text-[16px]
                 text-[#d5b77f]"
          aria-hidden="true"
        ></i>

        <span
          class="whitespace-nowrap
                 font-top-bar
                 text-[15px]
                 font-normal
                 tracking-wide
                 leading-6
                 text-[#f7f3eb]"
        >
          Olsztyn, ul. Dąbrowszczaków 21/3
        </span>
      </div>

      <!-- ADRES: LG OD 1024 PX -->
      <div
        class="hidden lg:flex
               items-center gap-3"
      >
        <i
          class="fa-solid fa-house
                 text-[16px]
                 text-[#d5b77f]"
          aria-hidden="true"
        ></i>

        <span
          class="whitespace-nowrap
                 font-top-bar
                 text-[15px]
                 font-normal
                 tracking-wide
                 leading-6
                 text-[#f7f3eb]"
        >
          10-540 Olsztyn, ul. Dąbrowszczaków 21 lok. 3
        </span>
      </div>

      <!-- TELEFON I E-MAIL -->
      <div class="flex items-center gap-6">
        <a
          href="tel:+48895273839"
          class="flex items-center gap-3
                 whitespace-nowrap
                 font-top-bar
                 text-[15px]
                 font-normal
                 tracking-wide
                 text-[#f7f3eb]
                 transition-colors
                 hover:text-white"
        >
          <i
            class="fa-solid fa-phone
                   text-[14px]
                   text-[#d5b77f]"
            aria-hidden="true"
          ></i>

          <span>89 527 38 39</span>
        </a>

        <a
          href="mailto:notariusz@wladyslawski.pl"
          class="flex items-center gap-3
                 whitespace-nowrap
                 font-top-bar
                 text-[15px]
                 font-normal
                 tracking-wide
                 text-[#f7f3eb]
                 transition-colors
                 hover:text-white"
        >
          <i
            class="fa-solid fa-envelope
                   text-[14px]
                   text-[#d5b77f]"
            aria-hidden="true"
          ></i>

          <span>notariusz@wladyslawski.pl</span>
        </a>
      </div>
    </div>
  </div>
</header>
