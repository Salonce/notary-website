<header
  class="relative
         w-full
         overflow-hidden
         border-b border-[#b59b5b]/40
         bg-[#f7f4ec]"
>

  <!-- =========================================
       TŁO - ZŁOTY ORNAMENT
       ========================================= -->

  <!-- SZEROKIE CENTRALNE ROZŚWIETLENIE -->

  <div
    class="pointer-events-none absolute
           left-1/2 top-1/2
           h-[260px] w-[520px]
           -translate-x-1/2
           -translate-y-1/2
           rounded-full
           bg-[#b59b5b]/[0.15]
           blur-3xl"
    aria-hidden="true"
  ></div>

  <div
    class="pointer-events-none absolute
           left-1/2 top-1/2
           h-[130px] w-[360px]
           -translate-x-1/2
           -translate-y-1/2
           rounded-full
           bg-[#fffaf0]/[0.90]
           blur-2xl"
    aria-hidden="true"
  ></div>


  <!-- =========================================
       SZEROKI ORNAMENT LEWY
       ========================================= -->

           h-[300px] w-[300px]

           border-[#b59b5b]/[0.28]"

    class="pointer-events-none absolute

           h-[240px] w-[240px]
           rounded-full
           border

           h-[165px] w-[165px]
           rounded-full
           border
           border-[#b59b5b]/[0.14]"
    aria-hidden="true"
  ></div>


  <!-- =========================================
       SZEROKI ORNAMENT PRAWY
       ========================================= -->

  <div
    class="pointer-events-none absolute
           -right-32 -bottom-32
           h-[300px] w-[300px]
           rounded-full
           border
           border-[#b59b5b]/[0.28]"
    aria-hidden="true"
  ></div>

  <div
    class="pointer-events-none absolute
           -right-20 -bottom-20
           h-[240px] w-[240px]
           rounded-full
           border
           border-[#b59b5b]/[0.20]"

  <div
    class="pointer-events-none absolute
           -right-8 -bottom-8
           h-[165px] w-[165px]
           rounded-full
           border
           border-[#b59b5b]/[0.14]"
    aria-hidden="true"
  ></div>

       DŁUŻSZE ŁUKI WZDŁUŻ PASKA
       ========================================= -->

  <div
    class="pointer-events-none absolute
           left-[12%] top-1/2
           h-[190px] w-[520px]
           -translate-y-1/2
           rounded-full
           border
           border-[#b59b5b]/[0.08]"
    aria-hidden="true"
  ></div>

  <div
    class="pointer-events-none absolute
           right-[12%] top-1/2
           h-[190px] w-[520px]
           -translate-y-1/2
           rounded-full
           border
           border-[#b59b5b]/[0.08]"
    aria-hidden="true"
  ></div>


  <!-- =========================================
       DELIKATNA SIATKA
       ========================================= -->

  <div
    class="pointer-events-none absolute inset-0 opacity-50"
    aria-hidden="true"
  >

    <div
      class="absolute inset-0
             bg-[linear-gradient(135deg,transparent_0%,transparent_46%,rgba(181,155,91,0.13)_48%,transparent_50%,transparent_100%)]"
    ></div>

    <div
      class="absolute inset-0
             bg-[linear-gradient(45deg,transparent_0%,transparent_46%,rgba(181,155,91,0.09)_48%,transparent_50%,transparent_100%)]"
    ></div>

  </div>


  <!-- =========================================
       DELIKATNE LINIE KRAWĘDZIOWE
       ========================================= -->

  <div
    class="pointer-events-none absolute
           inset-x-0 top-0
           h-px
           bg-[#b59b5b]/[0.35]"
    aria-hidden="true"
  ></div>

  <div
    class="pointer-events-none absolute
           inset-x-0 bottom-0
           h-px
           bg-[#b59b5b]/[0.30]"
    aria-hidden="true"
  ></div>


  <!-- =========================================
       TREŚĆ
       ========================================= -->

  <div
    class="relative z-10
           mx-auto flex max-w-7xl
           items-center justify-between
           px-3 py-2.5
           sm:px-6"
  >

    <!-- =========================================
         MOBILE
         ========================================= -->

    <div
      class="flex w-full
             items-center
             justify-between
             gap-3
             md:hidden"
    >

      <!-- PHONE -->

      <a
        href="tel:+48895273839"
        class="flex shrink-0
               items-center gap-2
               font-main-body
               text-[14px]
               font-normal
               tracking-wide
               text-stone-600
               transition-colors
               hover:text-[#806c3e]"
      >

        <i
          class="fa-solid fa-phone
                 text-[13px]
                 text-[#b59b5b]"
          aria-hidden="true"
        ></i>

        <span class="whitespace-nowrap">
          89 527 38 39
        </span>

      </a>


      <!-- ADDRESS -->

      <span
        class="min-w-0 truncate
               text-right
               font-main-body
               text-[12px]
               font-normal

               tracking-wide

                 tracking-wide
                 leading-6
                 text-stone-600"

          10-540 Olsztyn, ul. Dąbrowszczaków 21 lok. 3
        </span>

      </div>


      <!-- CONTACT INFORMATION -->

        class="flex items-center gap-6"
      >

        <!-- PHONE -->

        <a
          href="tel:+48895273839"
          class="flex items-center gap-3
                 whitespace-nowrap
                 font-main-body
                 text-[15px]
                 font-normal
                 tracking-wide
                 text-stone-600
                 transition-colors
                 hover:text-[#806c3e]"
        >

          <i
            class="fa-solid fa-phone
                   text-[14px]
                   text-[#b59b5b]"
            aria-hidden="true"
          ></i>

          <span>
            89 527 38 39
          </span>

        </a>


        <!-- EMAIL -->

        <a
          href="mailto:notariusz@wladyslawski.pl"
          class="flex items-center gap-3
                 whitespace-nowrap
                 font-main-body
                 text-[15px]
                 font-normal
                 tracking-wide
                 text-stone-600
                 transition-colors
                 hover:text-[#806c3e]"

          <i
            class="fa-solid fa-envelope

                   text-[#b59b5b]"
            aria-hidden="true"

          <span>
