<!-- =========================================
     HERO SECTION – RESPONSIVE HEADER
     ========================================= -->

<header class="w-full min-w-0">
  <div class="w-full min-w-0">

    <div
      class="header-banner
             relative
             flex
             w-full
             min-w-0
             items-center
             justify-center
             overflow-hidden
             px-2
             text-center
             sm:px-4
             md:px-5"
    >

      <!-- PRAWA GÓRNA ORNAMENTY -->

      <div
        class="header-ornament
               pointer-events-none absolute -right-24 -top-24
               h-[320px] w-[320px] rounded-full
               border border-[var(--brand-burgundy)]/[0.10]"
        aria-hidden="true"
      ></div>

      <div
        class="header-ornament
               pointer-events-none absolute -right-10 -top-10
               h-[250px] w-[250px] rounded-full
               border border-[var(--brand-gold)]/[0.18]"
        aria-hidden="true"
      ></div>

      <div
        class="header-ornament
               pointer-events-none absolute -right-1 top-1
               h-[190px] w-[190px] rounded-full
               border border-[var(--brand-gold)]/[0.12]"
        aria-hidden="true"
      ></div>

      <!-- LEWA DOLNA ORNAMENTY -->

      <div
        class="header-ornament
               pointer-events-none absolute -bottom-28 -left-28
               h-[300px] w-[300px] rounded-full
               border border-[var(--brand-gold)]/[0.12]"
        aria-hidden="true"
      ></div>

      <div
        class="header-ornament
               pointer-events-none absolute -bottom-16 -left-16
               h-[220px] w-[220px] rounded-full
               border border-[var(--brand-burgundy)]/[0.07]"
        aria-hidden="true"
      ></div>

      <!-- ZŁOTA LINIA NA DOLE BANERA (rysuje się od środka) -->

      <div
        class="header-line pointer-events-none absolute bottom-0"
        aria-hidden="true"
      ></div>

      <!-- TREŚĆ -->

      <div
        class="relative z-10
               flex
               w-full
               min-w-0
               max-w-full
               flex-col
               items-center"
      >

        <!-- KANCELARIA NOTARIALNA -->

        <p
          class="header-subtitle header-reveal header-reveal-2
                 m-0
                 block
                 w-full
                 max-w-full
                 whitespace-nowrap
                 text-center
                 uppercase
                 text-stone-500"
        >
          {{ bannerParts[0] }}
        </p>

        <!-- IMIĘ I NAZWISKO -->

        <h1
          class="header-name header-reveal header-reveal-1
                 m-0
                 mt-3
                 block
                 w-full
                 min-w-0
                 max-w-full
                 whitespace-nowrap
                 text-center
                 leading-tight
                 text-[var(--brand-burgundy)]
                 sm:mt-4"
          aria-label="Zbigniew Władysławski"
        >
          {{ bannerParts[1] }}
        </h1>

        <!-- NOTARIUSZ -->

        <p
          class="header-role header-reveal header-reveal-3
                 m-0
                 mt-3
                 block
                 w-full
                 max-w-full
                 whitespace-nowrap
                 text-center
                 uppercase
                 text-stone-500
                 sm:mt-4"
        >
          {{ bannerParts[2] }}
        </p>

      </div>

    </div>

  </div>
</header>
