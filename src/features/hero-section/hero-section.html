
<!-- =========================================
     HERO SECTION – NAPIS + ZDJĘCIE
     Mobile: napis na zdjęciu
     Desktop: napis po lewej, zdjęcie po prawej
     ========================================= -->

<section id="home" class="hero">

  <!-- ===== NAPIS ===== -->

  <div class="hero-text">

    <!-- ZŁOTA LINIA (rysuje się od środka) -->

    <div class="hero-line pointer-events-none absolute bottom-0" aria-hidden="true"></div>

    <!-- TEKST -->

    <div class="hero-copy">

      <p class="hero-subtitle hero-reveal hero-reveal-2">
        {{ bannerParts[0] }}
      </p>

      <h1
        class="hero-name hero-reveal hero-reveal-1"
        aria-label="Zbigniew Władysławski"
      >
        {{ bannerParts[1] }}
      </h1>

      <p class="hero-role hero-reveal hero-reveal-3">
        {{ bannerParts[2] }}
      </p>

    </div>

  </div>

  <!-- ===== ZDJĘCIE ===== -->

  <div class="hero-media">

    <picture>
      <!-- Mobile: do 900 px -->
      <source
        media="(max-width: 900px)"
        srcset="assets/biurowiec1-mobile.webp"
        type="image/webp"
      />

      <!-- Tablet i desktop: powyżej 900 px -->
      <img
        class="hero-image"
        src="assets/biurowiec1.jpg"
        alt="Biurowiec, w którym mieści się kancelaria"
        width="1600"
        height="900"
        fetchpriority="high"
      />
    </picture>

  </div>

</section>
