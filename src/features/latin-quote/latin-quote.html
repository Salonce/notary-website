<!-- MOTTO -->
<section class="w-full min-w-0 overflow-visible py-3">
  <div class="mx-auto w-full min-w-0 px-3 text-center sm:px-6 md:px-10">
    <div class="motto-ornament mx-auto flex w-full max-w-xl min-w-0 items-center justify-center gap-2 sm:gap-3" aria-hidden="true">
      <div class="flex min-w-0 flex-1 items-center justify-end">
        <span class="motto-ornament-line motto-ornament-line-left h-px min-w-0 flex-1"></span>
        <span class="motto-ornament-symbol ml-1.5 shrink-0 text-[14px] leading-none sm:ml-2 sm:text-[15px]">&#x2767;</span>
      </div>
      <span class="motto-ornament-symbol shrink-0 text-[12px]">&#x2726;</span>
      <div class="flex min-w-0 flex-1 items-center justify-start">
        <span class="motto-ornament-symbol motto-ornament-symbol-right mr-1.5 shrink-0 text-[14px] leading-none sm:mr-2 sm:text-[15px]">&#x2767;</span>
        <span class="motto-ornament-line motto-ornament-line-right h-px min-w-0 flex-1"></span>
      </div>
    </div>

    <p
      class="latin-quote mx-auto my-6 w-full min-w-0 whitespace-normal break-words
             font-motto text-[clamp(14px,4.3vw,25px)] leading-relaxed tracking-[0.06em]
             sm:whitespace-nowrap sm:text-[25px] md:my-7 md:text-[34px] lg:text-[38px]"
      aria-label="LEX EST QUOD NOTAMUS"
    >
      <span>L</span><span>E</span><span>X</span>
      <span>&nbsp;</span>
      <span>E</span><span>S</span><span>T</span>
      <span>&nbsp;</span>
      <span>Q</span><span>U</span><span>O</span><span>D</span>
      <span>&nbsp;</span>
      <span>N</span><span>O</span><span>T</span><span>A</span><span>M</span><span>U</span><span>S</span>
    </p>

    <div class="motto-ornament motto-ornament-bottom mx-auto flex w-full max-w-xl min-w-0 items-center justify-center gap-2 sm:gap-3" aria-hidden="true">
      <div class="flex min-w-0 flex-1 items-center justify-end">
        <span class="motto-ornament-line motto-ornament-line-left h-px min-w-0 flex-1"></span>
        <span class="motto-ornament-symbol ml-1.5 shrink-0 text-[14px] leading-none sm:ml-2 sm:text-[15px]">&#x2767;</span>
      </div>
      <span class="motto-ornament-symbol shrink-0 text-[12px]">&#x2726;</span>
      <div class="flex min-w-0 flex-1 items-center justify-start">
        <span class="motto-ornament-symbol motto-ornament-symbol-right mr-1.5 shrink-0 text-[14px] leading-none sm:mr-2 sm:text-[15px]">&#x2767;</span>
        <span class="motto-ornament-line motto-ornament-line-right h-px min-w-0 flex-1"></span>
      </div>
    </div>

  </div>
</section>
