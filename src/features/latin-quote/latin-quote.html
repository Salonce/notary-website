<!-- MOTTO -->

<div class="w-full">

  <div
    class="mx-auto w-full
           px-6 py-0
           text-center
           md:px-10 md:py-0"
  >

    <!-- =========================================
         GÓRNA OZDOBNA LINIA
         ========================================= -->

    <div
      class="mx-auto
             flex
             max-w-xl
             items-center
             justify-center
             gap-3"
      aria-hidden="true"
    >

      <!-- lewa gałązka -->
      <div class="flex flex-1 items-center justify-end">
        <span
          class="h-px
                 w-20
                 bg-gradient-to-r
                 from-transparent
                 via-[#b3a06a]/50
                 to-[#b3a06a]"
        ></span>

        <span
          class="ml-2
                 text-[15px]
                 leading-none
                 text-[#b3a06a]"
        >
          ❧
        </span>
      </div>

      <!-- środek -->
      <span
        class="text-[12px]
               text-[#9d8852]"
      >
        ✦
      </span>

      <!-- prawa gałązka -->
      <div class="flex flex-1 items-center justify-start">
        <span
          class="mr-2
                 text-[15px]
                 leading-none
                 text-[#b3a06a]"
        >
          ❧
        </span>

        <span
          class="h-px
                 w-20
                 bg-gradient-to-l
                 from-transparent
                 via-[#b3a06a]/50
                 to-[#b3a06a]"
        ></span>
      </div>

    </div>


    <!-- =========================================
         MOTTO
         ========================================= -->

    <p
      class="latin-quote
             font-motto
             text-[28px]
             md:text-[32px]
             lg:text-[36px]"
      aria-label="LEX EST QUOD NOTAMUS"
    >
      <span>L</span><span>E</span><span>X</span>
      <span>&nbsp;</span>
      <span>E</span><span>S</span><span>T</span>
      <span>&nbsp;</span>
      <span>Q</span><span>U</span><span>O</span><span>D</span>
      <span>&nbsp;</span>
      <span>N</span><span>O</span><span>T</span><span>A</span><span>M</span><span>U</span><span>S</span>
    </p>


    <!-- =========================================
         DOLNA OZDOBNA LINIA
         ========================================= -->

    <div
      class="mx-auto
             flex
             max-w-xl
             items-center
             justify-center
             gap-3"
      aria-hidden="true"
    >

      <!-- lewa gałązka -->
      <div class="flex flex-1 items-center justify-end">
        <span
          class="h-px
                 w-20
                 bg-gradient-to-r
                 from-transparent
                 via-[#b3a06a]/50
                 to-[#b3a06a]"
        ></span>

        <span
          class="ml-2
                 rotate-180
                 text-[15px]
                 leading-none
                 text-[#b3a06a]"
        >
          ❧
        </span>
      </div>

      <!-- środek -->
      <span
        class="text-[12px]
               text-[#9d8852]"
      >
        ✦
      </span>

      <!-- prawa gałązka -->
      <div class="flex flex-1 items-center justify-start">
        <span
          class="mr-2
                 rotate-180
                 text-[15px]
                 leading-none
                 text-[#b3a06a]"
        >
          ❧
        </span>

        <span
          class="h-px
                 w-20
                 bg-gradient-to-l
                 from-transparent
                 via-[#b3a06a]/50
                 to-[#b3a06a]"
        ></span>
      </div>

    </div>

  </div>

</div>
