
<!-- MOTTO -->
<section class="w-full min-w-0 overflow-hidden py-8">
  <div
    class="mx-auto w-full min-w-0 px-3 text-center
           sm:px-6 md:px-10"
  >
    <!-- GÓRNA OZDOBNA LINIA -->
    <div
      class="mx-auto flex w-full max-w-xl min-w-0
             items-center justify-center gap-2 sm:gap-3"
      aria-hidden="true"
    >
      <!-- LEWA GAŁĄZKA -->
      <div class="flex min-w-0 flex-1 items-center justify-end">
        <span
          class="h-px min-w-0 flex-1
                 bg-gradient-to-r
                 from-transparent via-[var(--brand-gold)]/50 to-[var(--brand-gold)]"
        ></span>

        <span class="ml-1.5 shrink-0 text-[14px] leading-none text-[var(--brand-gold)] sm:ml-2 sm:text-[15px]">
          ❧
        </span>
      </div>

      <!-- ŚRODEK -->
      <span class="shrink-0 text-[12px] text-[var(--brand-gold)]">
        ✦
      </span>

      <!-- PRAWA GAŁĄZKA -->
      <div class="flex min-w-0 flex-1 items-center justify-start">
        <span class="mr-1.5 shrink-0 text-[14px] leading-none text-[var(--brand-gold)] sm:mr-2 sm:text-[15px]">
          ❧
        </span>

        <span
          class="h-px min-w-0 flex-1
                 bg-gradient-to-l
                 from-transparent via-[var(--brand-gold)]/50 to-[var(--brand-gold)]"
        ></span>
      </div>
    </div>

    <!-- MOTTO -->
    <p
      class="latin-quote mx-auto my-5 w-full min-w-0
             whitespace-normal break-words
             font-motto
             text-[clamp(13px,4.15vw,24px)]
             leading-relaxed
             tracking-[0.06em]
             sm:whitespace-nowrap sm:text-[24px]
             md:my-6 md:text-[32px]
             lg:text-[36px]"
      aria-label="LEX EST QUOD NOTAMUS"
    >
      <span>L</span><span>E</span><span>X</span>
      <span>&nbsp;</span>
      <span>E</span><span>S</span><span>T</span>
      <span>&nbsp;</span>
      <span>Q</span><span>U</span><span>O</span><span>D</span>
      <span>&nbsp;</span>
      <span>N</span><span>O</span><span>T</span><span>A</span><span>M</span><span>U</span><span>S</span>
    </p>

    <!-- DOLNA OZDOBNA LINIA -->
    <div
      class="mx-auto flex w-full max-w-xl min-w-0
             items-center justify-center gap-2 sm:gap-3"
      aria-hidden="true"
    >
      <!-- LEWA GAŁĄZKA -->
      <div class="flex min-w-0 flex-1 items-center justify-end">
        <span
          class="h-px min-w-0 flex-1
                 bg-gradient-to-r
                 from-transparent via-[var(--brand-gold)]/50 to-[var(--brand-gold)]"
        ></span>

        <span class="ml-1.5 shrink-0 rotate-180 text-[14px] leading-none text-[var(--brand-gold)] sm:ml-2 sm:text-[15px]">
          ❧
        </span>
      </div>

      <!-- ŚRODEK -->
      <span class="shrink-0 text-[12px] text-[var(--brand-gold)]">
        ✦
      </span>

      <!-- PRAWA GAŁĄZKA -->
      <div class="flex min-w-0 flex-1 items-center justify-start">
        <span class="mr-1.5 shrink-0 rotate-180 text-[14px] leading-none text-[var(--brand-gold)] sm:mr-2 sm:text-[15px]">
          ❧
        </span>

        <span
          class="h-px min-w-0 flex-1
                 bg-gradient-to-l
                 from-transparent via-[var(--brand-gold)]/50 to-[var(--brand-gold)]"
        ></span>
      </div>
    </div>
  </div>
</section>
