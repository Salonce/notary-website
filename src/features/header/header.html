<!-- BANER KANCELARII -->

<header
  id="home"
  class="w-full bg-[#faf9f6]"
>
  <div
    class="mx-auto max-w-7xl
           px-4 py-5
           sm:px-6 sm:py-6
           md:px-8 md:py-7
           lg:py-8"
  >

    <div
      class="header-banner
             relative
             flex min-h-[190px]
             w-full
             items-center justify-center
             overflow-hidden
             border-y border-[#b59b5b]/60
             bg-white
             px-5 py-8
             text-center
             sm:min-h-[210px]
             sm:px-7 sm:py-9
             md:min-h-[220px]
             md:w-1/2
             md:px-8 md:py-10"
    >

      <!-- DELIKATNE BOCZNE AKCENTY -->

      <span
        class="header-side-line
               absolute left-0 top-1/2
               h-px
               w-8
               -translate-y-1/2
               bg-[#b59b5b]/50
               sm:w-10
               md:w-12
               lg:w-16"
        aria-hidden="true"
      ></span>

      <span
        class="header-side-line
               absolute right-0 top-1/2
               h-px
               w-8
               -translate-y-1/2
               bg-[#b59b5b]/50
               sm:w-10
               md:w-12
               lg:w-16"
        aria-hidden="true"
      ></span>


      <!-- GŁÓWNA NAZWA -->

      <div
        class="relative z-10
               flex flex-col
               items-center
               font-['Libre_Baskerville']"
      >

        <!-- KANCELARIA NOTARIALNA -->

        <div
          class="header-small-title
                 flex items-center
                 gap-3
                 sm:gap-4"
        >

          <span
            class="h-px w-5
                   bg-[#b59b5b]/70
                   sm:w-7
                   md:w-8"
            aria-hidden="true"
          ></span>

          <span
            class="text-[10px]
                   font-normal
                   uppercase
                   tracking-[0.20em]
                   text-stone-500
                   sm:text-xs
                   md:text-sm"
          >
            Kancelaria Notarialna
          </span>

          <span
            class="h-px w-5
                   bg-[#b59b5b]/70
                   sm:w-7
                   md:w-8"
            aria-hidden="true"
          ></span>

        </div>


        <!-- IMIĘ I NAZWISKO -->

        <h1
          class="header-name
                 mt-3
                 text-2xl
                 font-normal
                 tracking-[0.025em]
                 text-[#9e1b32]
                 sm:mt-4
                 sm:text-3xl
                 md:text-3xl
                 lg:text-4xl"
        >
          Zbigniew Władysławski
        </h1>


        <!-- NOTARIUSZ JAKO CZĘŚĆ NAZWY -->

        <div
          class="header-role
                 mt-3
                 flex items-center
                 gap-3
                 sm:mt-4
                 sm:gap-4"
        >

          <span
            class="h-px w-7
                   bg-stone-300
                   sm:w-9
                   md:w-10"
            aria-hidden="true"
          ></span>

          <span
            class="text-[10px]
                   font-normal
                   uppercase
                   tracking-[0.25em]
                   text-stone-500
                   sm:text-xs"
          >
            Notariusz
          </span>

          <span
            class="h-px w-7
                   bg-stone-300
                   sm:w-9
                   md:w-10"
            aria-hidden="true"
          ></span>

        </div>


        <!-- DOLNY ZŁOTY AKCENT -->

        <div
          class="header-main-line
                 mt-5
                 h-px w-16
                 bg-[#b59b5b]
                 sm:mt-6
                 sm:w-20"
          aria-hidden="true"
        ></div>

      </div>

    </div>

  </div>
</header>
